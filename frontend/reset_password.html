<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babelr</title>
    <link rel="stylesheet" type="text/css" media="screen" href="stylesheets/reset_password.css" />
</head>
<body>
    <div class="reset-password-container">
        <h3 id="reset-password-header">Reset Your Password</h3>
        <p id="reset-password-info">Enter your email address and we will send you instructions to reset your password</p>
        <form class="reset-password-form">
            <div class="reset-password-form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit" class="reset-password-button">Send Reset Instructions</button>
        </form>
        <p class="back-to-login-link"><a href="#">Back to Login</a></p>
    </div>
</body>
</html>
