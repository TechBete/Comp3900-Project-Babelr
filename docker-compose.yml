version: '3.8'

services:
  Babelr_db:
    image: postgres:14
    container_name: Babelr
    environment:
      POSTGRES_USER: Babelr
      POSTGRES_PASSWORD: W16B3900 # Change this to your own password in PROD, additionally do not hardcode passwords in PROD
      POSTGRES_DB: Babelr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  
      # Persists data even after container is stopped or removed by using docker commands
      # (persistence will work if using docker-compose down to remove containers)
      # (persistence does not work if using docker-compose down -v)

  web:
    build: ./backend
    environment:                  # dont hardcode environment variables in PROD
      POSTGRES_USER: Babelr
      POSTGRES_PASSWORD: W16B3900 # Change this to your own password in PROD
      POSTGRES_DB: Babelr_db
      POSTGRES_HOST: Babelr_db
    ports:
      - "8016:8016"
    depends_on:
      - Babelr_db

  nextjs:
    build: 
      context: ./frontend/babelr
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./frontend/babelr:/usr/src/app # hot reloading
      - /usr/src/app/node_modules # download only once 
    depends_on:
      - web
      - Babelr_db
    command: "npm run start"

volumes:
  postgres_data:
    driver: local