version: '3.8'

services:
  Babelr_db:
    image: postgres:14
    container_name: Babelr_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Change this to your own password in PROD in the .env file
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  
      # Persists data even after container is stopped or removed by using docker commands
      # (persistence will work if using docker-compose down to remove containers)
      # (persistence does not work if using docker-compose down -v; -v flag removes volumes)
    networks:
      - app_network

  web:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: Babelr_server
    environment:                  
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Change this to your own password in PROD in the .env file
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
    ports:
      - "8016:8016"
    depends_on:
      - Babelr_db
    env_file:
      - .env
    networks:
      - app_network
    volumes:
      - ./audioData:/app/audioData:rw   
      # Mounts the audioData folder to the container
      # this can be updated to the proper method when integrating with a cloud storage service
      # (e.g. AWS S3, Google Cloud Storage, Azure Blob Storage)   

  frontend:
    build: ./frontend/babelr
    container_name: Babelr_client
    ports:
      - "3000:3000"
    depends_on:
      - web
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://web:8016
    env_file:
      - .env
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
